[env:badge]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Waveshare ESP32-S3-Touch-AMOLED-1.75C: 32MB QIO flash + 8MB OPI PSRAM
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; v1.2: use the esp-sr IDF headers shipped inside the framework's
    ; esp32s3 libs package directly (the Arduino ESP_SR wrapper library
    ; hard-filters MultiNet to English, so we bypass it).
    -I${sysenv.HOME}/.platformio/packages/framework-arduinoespressif32-esp32s3-libs/include/espressif__esp-sr/include/esp32s3
    -I${sysenv.HOME}/.platformio/packages/framework-arduinoespressif32-esp32s3-libs/include/espressif__esp-sr/src/include

lib_deps =
    https://github.com/moononournation/Arduino_GFX.git
    https://github.com/bitbank2/JPEGDEC.git
    https://github.com/lewisxhe/XPowersLib.git
